upstream nextjs_upstream {
    server nextjs:3000;
}

upstream django_upstream {
    server django:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50m;

    # ── Django: REST API ───────────────────────────────────────────────
    # Note: Next.js internal route handlers (e.g. /api/revalidate) are
    # deliberately NOT reachable through nginx — Django calls them
    # server-to-server at http://nextjs:3000 inside the Docker network.
    location /api/ {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django: admin (the free CMS) ───────────────────────────────────
    location /sharnav/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Django: static assets (admin CSS/JS). Prefixed django-static/
    # so it never collides with Next.js /_next/static.
    location /django-static/ {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
    }

    # ── Everything else → Next.js (upgrade headers keep dev HMR alive) ─
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
